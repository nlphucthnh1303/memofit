<div class="flex items-center justify-center min-h-screen bg-slate-100/50 p-4">
  <div class="w-full max-w-sm bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
    <h1 class="font-sans text-2xl font-bold text-blue-700 text-center mb-8">Memofit</h1>
    
    <h2 class="font-sans text-xl font-semibold text-slate-900 mb-2">Đổi mật khẩu</h2>
    <p class="font-sans text-sm text-slate-600 mb-6 leading-relaxed">Nhập mật khẩu mới của bạn để thay đổi mật khẩu tài khoản</p>

    <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-1.5">
          <label for="password" class="font-mono text-xs font-medium text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fi fi-rr-lock text-sm"></i> Mật khẩu
          </label>
          <input type="password" id="password" formControlName="password" placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-sans text-sm"
            [class.border-red-500]="changePasswordForm.get('password')?.invalid && (changePasswordForm.get('password')?.dirty || changePasswordForm.get('password')?.touched)">
      </div>
      <div class="flex flex-col gap-1.5">
          <label for="confirmPassword" class="font-mono text-xs font-medium text-slate-500 uppercase tracking-wider flex items-center gap-1.5">
            <i class="fi fi-rr-lock text-sm"></i> Xác nhận
          </label>
          <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-sans text-sm"
            [class.border-red-500]="changePasswordForm.get('confirmPassword')?.invalid && (changePasswordForm.get('confirmPassword')?.dirty || changePasswordForm.get('confirmPassword')?.touched)">
      </div>

      <button type="submit" [disabled]="changePasswordForm.invalid"
        class="w-full bg-blue-700 text-white py-3.5 rounded-xl font-sans font-semibold hover:bg-blue-800 disabled:bg-slate-300 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition duration-200">
        Thay đổi mật khẩu <i class="fi fi-rr-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center font-sans text-sm text-slate-600">
      <a href="#" class="font-semibold text-blue-700">< Quay lại đăng nhập</a>
    </div>
  </div>
</div>
