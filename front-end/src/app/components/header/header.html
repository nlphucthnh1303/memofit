<header
  class="flex justify-between items-center px-8 py-5 w-full mx-auto bg-slate-50 border-b border-solid border-gray-200"
>
  <h2 class="text-lg md:text-2xl font-bold text-blue-700">{{ title }}</h2>

  <div class="flex items-center gap-3 md:gap-6">
    <div class="relative" id="notification-center">
      <button
        id="notification-bell-btn"
        class="relative text-slate-600 hover:text-slate-900 transition-colors p-1 md:p-2 min-h-11 min-w-11"
        (click)="toggleDropdown($event)"
        [attr.aria-expanded]="isDropdownOpen()"
        aria-label="Thông báo"
      >
        <i class="fi fi-rr-bell text-lg md:text-xl"></i>

        @if (unreadCount() > 0) {
          <span
            class="absolute -top-0.5 -right-0.5 md:top-0 md:right-0 flex items-center justify-center
                   min-w-5 h-5 px-1 rounded-full bg-red-500 text-white text-[10px] font-bold
                   shadow-sm ring-2 ring-slate-50 animate-badge-pop"
          >
            {{ unreadCount() > 99 ? '99+' : unreadCount() }}
          </span>
        }
      </button>

      @if (isDropdownOpen()) {
        <div
          id="notification-dropdown"
          class="absolute right-0 top-full mt-2 w-80 md:w-96
                 bg-white rounded-xl shadow-2xl border border-gray-100
                 ring-1 ring-black/5
                 animate-dropdown-in z-50 overflow-hidden"
        >
          <div
            class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100 bg-linear-to-r from-blue-50 to-indigo-50"
          >
            <h3 class="text-sm font-semibold text-slate-800">Thông báo</h3>
            @if (unreadCount() > 0) {
              <button
                id="mark-all-read-btn"
                class="text-xs font-medium text-blue-600 hover:text-blue-800 transition-colors hover:underline"
                (click)="markAllAsRead($event)"
              >
                Đánh dấu tất cả đã đọc
              </button>
            }
          </div>

          <div class="max-h-[400px] overflow-y-auto overscroll-contain custom-scrollbar">
            @if (notifications().length === 0) {
              <div class="flex flex-col items-center justify-center py-10 px-5">
                <i class="fi fi-rr-bell-slash text-3xl text-slate-300 mb-3"></i>
                <p class="text-sm text-slate-400">Không có thông báo nào</p>
              </div>
            } @else {
              @for (notification of notifications(); track notification.id) {
                <button
                  class="flex items-start gap-3 w-full px-5 py-3.5 text-left transition-all duration-150
                         hover:bg-blue-50/60 border-b border-gray-50 last:border-b-0 group cursor-pointer"
                  [class.bg-blue-50/40]="!notification.isRead"
                  [class.bg-white]="notification.isRead"
                  (click)="onNotificationClick(notification)"
                >
                  <div
                    class="shrink-0 w-9 h-9 rounded-lg flex items-center justify-center mt-0.5"
                    [class.bg-amber-100]="notification.type === NotificationType.REVIEW_DUE"
                    [class.bg-orange-100]="notification.type === NotificationType.STREAK"
                    [class.bg-blue-100]="notification.type === NotificationType.SYSTEM"
                  >
                    <i
                      class="text-sm"
                      [class]="getNotificationIcon(notification.type) + ' ' + getNotificationColor(notification.type)"
                    ></i>
                  </div>

                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                      <p
                        class="text-[13px] leading-snug truncate"
                        [class.font-semibold]="!notification.isRead"
                        [class.text-slate-800]="!notification.isRead"
                        [class.font-medium]="notification.isRead"
                        [class.text-slate-500]="notification.isRead"
                      >
                        {{ notification.title }}
                      </p>
                      @if (!notification.isRead) {
                        <span class="shrink-0 w-2 h-2 rounded-full bg-blue-500"></span>
                      }
                    </div>
                    <p class="text-xs text-slate-400 mt-0.5 line-clamp-2 leading-relaxed">
                      {{ notification.message }}
                    </p>
                    <p class="text-[11px] text-slate-300 mt-1.5">
                      {{ getRelativeTime(notification.createdAt) }}
                    </p>
                  </div>
                </button>
              }
            }
          </div>
        </div>
      }
    </div>
  </div>
</header>

<style>
  @keyframes badgePop {
    0% {
      transform: scale(0);
      opacity: 0;
    }
    60% {
      transform: scale(1.2);
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }
  .animate-badge-pop {
    animation: badgePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes dropdownIn {
    0% {
      opacity: 0;
      transform: translateY(-8px) scale(0.97);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }
  .animate-dropdown-in {
    animation: dropdownIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .custom-scrollbar::-webkit-scrollbar {
    width: 5px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: transparent;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 99px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
</style>
