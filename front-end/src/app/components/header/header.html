<header
  class="flex justify-between items-center px-8 py-5 w-full mx-auto bg-slate-50 border-b border-solid border-gray-200"
>
  <h2 class="text-lg md:text-2xl font-bold text-blue-700">{{title}}</h2>
  <div class="flex items-center gap-3 md:gap-6">
    <div class="relative w-48 md:w-80">
      <i
        class="fi fi-rr-search absolute left-3 md:left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm md:text-base"
      ></i>
      <input
        type="search"
        placeholder="Tìm kiếm..."
        class="w-full bg-white border border-slate-200 pl-9 md:pl-11 pr-3 md:pr-4 py-2 md:py-2.5 rounded-full text-xs md:text-sm font-sans focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-slate-400 shadow-sm"
      />
    </div>
    <button
      class="relative text-slate-600 hover:text-slate-900 transition-colors p-1 md:p-2 min-h-11 min-w-11"
    >
      <i class="fi fi-rr-bell text-lg md:text-xl"></i>
      <span
        class="absolute top-2.5 right-2.5 md:top-1.5 md:right-2 w-2 h-2 rounded-full bg-red-500 border-2 border-slate-50"
      ></span>
    </button>
  </div>
</header>
